# M9 exit check (docs/roadmap.md): changing the display currency changes the list prices.
# Runs against a preview build. Text patterns accept English and Turkish, since the app
# follows the device language.
#   maestro test .maestro/display-currency.yaml
appId: com.utilizing.markettracker
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'price-BTC'
      text: '\$.*'
    timeout: 30000
- tapOn: 'Settings|Ayarlar'
- tapOn: 'Euro \(EUR\)'
# Native stack back: Android's back button, iOS's edge swipe.
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: '1%, 50%'
          end: '90%, 50%'
- extendedWaitUntil:
    visible:
      id: 'price-BTC'
      text: '€.*'
    timeout: 10000
- assertVisible: '(Sources|Kaynaklar): (Binance|Kraken), ECB via Frankfurter'
