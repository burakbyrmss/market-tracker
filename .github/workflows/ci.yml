name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Development builds run only when started by hand: Actions → CI → Run workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate Expo types
        run: npm run typegen
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Test
        run: npm test -- --ci
      # ADR 0008: the committed icons and names are exactly what the script builds.
      - name: Coin assets are up to date
        run: |
          npm run coin-assets
          test -z "$(git status --porcelain -- assets/coins src/features/coins/generated)"
      - name: Expo doctor
        run: npx expo-doctor
      - name: Audit
        run: npm audit --audit-level=high

  eas-development-build:
    # Off on push since 2026-11-27 to save the EAS plan's build quota. Started by hand, it queues
    # a development build only for a native fingerprint that has none yet (ADR 0001).
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: eas-development-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: expo/expo-github-action@9.0.2
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Queue development builds for changed native fingerprints
        run: node scripts/eas-dev-build.mjs
